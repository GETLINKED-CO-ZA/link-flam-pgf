<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find talent – LINK F.L.A.M</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" href="favicon.png" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="site" id="site-header"></header>
<main><section><div class="wrap">
<h1 style="font-size:clamp(2rem,5vw,3rem)">Find the right freelancer</h1>
<p style="margin-top:10px">Pick a freelancer and send a booking request. LINK confirms their availability and connects you.</p>
<div class="filters">
<div><label for="fi">Industry</label><select id="fi"><option value="">All industries</option></select></div>
<div><label for="fl">Location</label><select id="fl"><option value="">Remote or on-site</option><option value="r">Remote</option><option value="l">Local / on-site</option></select></div>
<div><label for="fs">Star rating</label><select id="fs"><option value="0">Any rating</option><option value="5">5 stars</option><option value="4">4 stars and up</option><option value="3">3 stars and up</option><option value="2">2 stars and up</option><option value="1">1 star and up</option></select></div>
</div>
<p id="count" class="note" aria-live="polite"></p>
<div class="fgrid" id="grid" style="margin-top:14px"></div>
</div></section></main>

<dialog id="dlg"><form id="bk" method="dialog">
<div class="who"><img id="dp" alt=""><div><h3 id="dn" style="margin:0"></h3><span id="di" class="note"></span></div></div>
<input type="hidden" name="freelancer_id"><input type="hidden" name="freelancer_name"><input type="hidden" name="freelancer_industry">
<div class="two row"><div><label for="b1">Your name</label><input id="b1" name="name" required></div><div><label for="b2">Company (optional)</label><input id="b2" name="company"></div></div>
<div class="two row"><div><label for="b3">Email</label><input id="b3" name="email" type="email" required></div><div><label for="b4">Phone / WhatsApp</label><input id="b4" name="phone" type="tel" required></div></div>
<div class="row"><label for="b5">Project brief</label><textarea id="b5" name="brief" rows="5" required placeholder="What do you need done, and by when?"></textarea></div>
<p class="note">LINK will confirm availability with the freelancer before connecting you. A transparent Linking Fee is added on top of their quoted rate.</p>
<div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap"><button class="btn" type="submit">Send booking request</button><button class="btn ghost" type="button" id="cl">Close</button></div>
<div class="msg" role="status"></div>
</form></dialog>
<script src="freelancers.js"></script>
<footer id="site-footer"></footer><script src="app.js"></script>
<script>
const $=id=>document.getElementById(id),grid=$('grid'),dlg=$('dlg'),bk=$('bk');
[...new Set(FREELANCERS.map(f=>f.industry))].sort().forEach(i=>$('fi').add(new Option(i,i)));
const stars=n=>`<span class="stars" role="img" aria-label="${n} out of 5 stars">${'★'.repeat(n)}<i>${'★'.repeat(5-n)}</i></span>`;
const photo=f=>f.photo||initialsPhoto(f.name);
function render(){
 const i=$('fi').value,l=$('fl').value,s=+$('fs').value;
 const list=FREELANCERS.filter(f=>(!i||f.industry===i)&&(!l||(l==='r')===f.remote)&&f.rating>=s);
 $('count').textContent=list.length+(list.length===1?' freelancer found':' freelancers found');
 grid.innerHTML=list.length?list.map(f=>`<button class="fcard" data-id="${f.id}"><img src="${photo(f)}" alt="${f.name}" loading="lazy"><div><h3>${f.name}</h3><span class="tag">${f.industry}</span><span class="tag">${f.remote?'Remote':'On-site'}</span><p>${f.bio}</p>${stars(f.rating)} <span class="note">LINK rating</span></div></button>`).join(''):'<p>No freelancers match these filters. Try a different industry or rating.</p>';
}
['fi','fl','fs'].forEach(x=>$(x).onchange=render);
grid.onclick=e=>{const c=e.target.closest('.fcard');if(!c)return;const f=FREELANCERS.find(x=>x.id===c.dataset.id);
 $('dp').src=photo(f);$('dp').alt=f.name;$('dn').textContent='Book '+f.name;$('di').textContent=f.industry+' · '+f.location;
 bk.freelancer_id.value=f.id;bk.freelancer_name.value=f.name;bk.freelancer_industry.value=f.industry;bk.querySelector('.msg').className='msg';dlg.showModal();};
$('cl').onclick=()=>dlg.close();
bk.onsubmit=e=>{e.preventDefault();submitForm(bk,'/api/booking','Request sent. Check your inbox for a confirmation. LINK will contact the freelancer and get back to you shortly.');};
render();
</script></body></html>
