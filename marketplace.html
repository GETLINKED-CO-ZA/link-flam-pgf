
<script>
(() => {
  'use strict';

  const MARKETPLACE_URL = 'https://getlinked.co.za';

  const $ = id => document.getElementById(id);
  const grid = $('grid');
  const dlg = $('dlg');
  const bk = $('bk');

  if (!grid || !dlg || !bk || !Array.isArray(FREELANCERS)) {
    console.error('LINK F.L.A.M: Required elements or freelancer data missing.');
    return;
  }

  // Only allow safe image sources.
  function safeImageUrl(value) {
    if (typeof value !== 'string' || !value.trim()) return '';

    // Allow safe raster data images only.
    if (/^data:image\/(png|jpeg|webp|gif);base64,/i.test(value)) {
      return value;
    }

    try {
      const url = new URL(value, window.location.origin);

      if (
        url.protocol !== 'https:' &&
        !(url.protocol === 'http:' && url.origin === window.location.origin)
      ) {
        return '';
      }

      return url.href;
    } catch {
      return '';
    }
  }

  // Create elements without injecting user data as HTML.
  function element(tag, className, content) {
    const node = document.createElement(tag);

    if (className) node.className = className;
    if (content !== undefined) node.textContent = String(content);

    return node;
  }

  function addTag(parent, text) {
    parent.appendChild(element('span', 'tag', text));
  }

  // Populate industry filter safely.
  const industries = [...new Set(
    FREELANCERS
      .map(f => f.industry)
      .filter(v => typeof v === 'string' && v.trim())
  )].sort();

  industries.forEach(industry => {
    const option = document.createElement('option');
    option.value = industry;
    option.textContent = industry;
    $('fi').appendChild(option);
  });

  function createPhoto(f) {
    const img = element('img');

    img.alt = String(f.name || 'Freelancer');
    img.loading = 'lazy';
    img.decoding = 'async';

    const source = safeImageUrl(f.photo);

    if (source) {
      img.src = source;
    } else {
      img.hidden = true;
    }

    return img;
  }

  function createStars(rating) {
    const value = Math.max(0, Math.min(5, Math.floor(Number(rating) || 0)));

    const stars = element('span', 'stars');
    stars.setAttribute('role', 'img');
    stars.setAttribute('aria-label', value + ' out of 5 stars');
    stars.textContent = '★'.repeat(value);

    const remaining = element('i');
    remaining.textContent = '★'.repeat(5 - value);

    stars.appendChild(remaining);

    return stars;
  }

  // Marketplace card: opens ONLY the marketplace.
  function createMarketplaceCard(f) {
    const link = element('a', 'fcard');

    link.href = MARKETPLACE_URL;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.referrerPolicy = 'no-referrer';

    link.style.textDecoration = 'none';
    link.style.color = 'inherit';

    link.appendChild(createPhoto(f));

    const content = element('div');

    content.appendChild(element('h3', '', f.name));
    addTag(content, f.industry);
    addTag(content, f.remote ? 'Remote' : 'On-site');

    content.appendChild(element('p', '', f.bio));

    const button = element('span', 'btn', 'Get Listed');
    button.style.display = 'inline-block';
    button.style.marginTop = '10px';

    content.appendChild(button);
    link.appendChild(content);

    return link;
  }

  // Normal freelancer card.
  function createFreelancerCard(f) {
    const button = element('button', 'fcard');

    button.type = 'button';
    button.dataset.id = String(f.id);

    button.appendChild(createPhoto(f));

    const content = element('div');

    content.appendChild(element('h3', '', f.name));
    addTag(content, f.industry);
    addTag(content, f.remote ? 'Remote' : 'On-site');

    content.appendChild(element('p', '', f.bio));
    content.appendChild(createStars(f.rating));

    const note = element('span', 'note', 'LINK rating');
    content.appendChild(note);

    button.appendChild(content);

    return button;
  }

  function render() {
    const industry = $('fi').value;
    const location = $('fl').value;
    const rating = Number($('fs').value) || 0;

    const list = FREELANCERS.filter(f =>
      (!industry || f.industry === industry) &&
      (!location || (location === 'r') === Boolean(f.remote)) &&
      Number(f.rating) >= rating
    );

    $('count').textContent =
      list.length + (list.length === 1
        ? ' freelancer found'
        : ' freelancers found');

    const fragment = document.createDocumentFragment();

    if (list.length) {
      list.forEach(f => {
        if (!f || typeof f !== 'object') return;

        const card = f.id === 'template'
          ? createMarketplaceCard(f)
          : createFreelancerCard(f);

        fragment.appendChild(card);
      });
    } else {
      fragment.appendChild(
        element('p', '', 'No freelancers match these filters. Try a different industry or rating.')
      );
    }

    grid.replaceChildren(fragment);
  }

  // Filters.
  ['fi', 'fl', 'fs'].forEach(id => {
    $(id).addEventListener('change', render);
  });

  // Booking dialog. Marketplace links are never handled here.
  grid.addEventListener('click', event => {
    const button = event.target.closest('button.fcard');

    if (!button || !grid.contains(button)) return;

    const freelancer = FREELANCERS.find(
      f => String(f.id) === button.dataset.id && f.id !== 'template'
    );

    if (!freelancer) return;

    $('dp').src = safeImageUrl(freelancer.photo);
    $('dp').alt = String(freelancer.name || 'Freelancer');

    $('dn').textContent = 'Book ' + freelancer.name;
    $('di').textContent =
      freelancer.industry + ' · ' + freelancer.location;

    bk.elements.namedItem('freelancer_id').value = freelancer.id;
    bk.elements.namedItem('freelancer_name').value = freelancer.name;
    bk.elements.namedItem('freelancer_industry').value = freelancer.industry;

    bk.querySelector('.msg').textContent = '';
    bk.querySelector('.msg').className = 'msg';

    dlg.showModal();
  });

  // Close dialog.
  $('cl').addEventListener('click', () => {
    dlg.close();
  });

  // Booking submission.
  bk.addEventListener('submit', event => {
    event.preventDefault();

    if (!bk.reportValidity()) return;

    if (typeof submitForm !== 'function') {
      console.error('LINK F.L.A.M: Booking submission unavailable.');
      return;
    }

    submitForm(
      bk,
      '/api/booking',
      'Request sent. Check your inbox for a confirmation. LINK will contact the freelancer and get back to you shortly.'
    );
  });

  render();

})();
</script>
